name: S&P 500 one-year finalists validation
on:
  push:
    paths:
      - 'scripts/verify-sp500-finalists.mjs'
      - '.github/workflows/sp500-finalists.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Download Dukascopy S&P 500 BID one-year history
        env:
          SP500_HISTORY_BUILD: '1'
        run: node scripts/prepare-sp500-history.mjs
      - name: Test finalists on early unseen months and entire year
        run: node --experimental-strip-types --expose-gc scripts/verify-sp500-finalists.mjs
      - name: Upload comprehensive final results
        uses: actions/upload-artifact@v4
        with:
          name: sp500-session-finalists
          path: /tmp/sp500-finalists.json
          if-no-files-found: error
