name: WTI Oil one-year history verification
on:
  push:
    paths:
      - 'scripts/prepare-wti-history.mjs'
      - '.github/workflows/wti-history.yml'
  workflow_dispatch:

jobs:
  wti_one_year:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Download one year of actual Dukascopy WTI BID 15m candles
        env:
          WTI_HISTORY_BUILD: '1'
          WTI_HISTORY_VERBOSE: '1'
        run: node scripts/prepare-wti-history.mjs
      - name: Run the WTI breakout Pine Script on downloaded candles
        run: node --experimental-strip-types scripts/check-wti-backtest.mjs
      - name: Validate year coverage and source manifest
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const m = JSON.parse(readFileSync('public/history/wti/manifest.json', 'utf8'));
            if (m.instrument !== 'LIGHT.CMD/USD' || m.provider !== 'Dukascopy' ||
                m.priceType !== 'bid' || m.timeframeMinutes !== 15 ||
                m.candleCount < 12000 || !m.files.length) process.exit(1);
            console.log(m.requestedFrom, m.requestedToExclusive, m.candleCount, 'WTI BID candles');
          "
